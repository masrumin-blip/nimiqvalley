<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desa Siang &amp; Malam</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a1426}canvas{display:block}
#ui{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:rgba(10,16,30,.55);backdrop-filter:blur(8px);color:#f3ead8;font:13px system-ui,sans-serif;flex-wrap:wrap;justify-content:center;max-width:94vw}
#ui button{background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;padding:5px 10px;border-radius:8px;cursor:pointer}
#ui button.on{background:#f3ead8;color:#1a1a2a}
#ui input{width:160px}#jam{font-variant-numeric:tabular-nums;min-width:44px;text-align:center}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui"><span id="jam">00:00</span><input id="sl" type="range" min="0" max="24" step="0.05" value="12">
<button data-m="auto" class="on">Auto</button><button data-m="real">Real time</button><button data-m="manual">Manual</button></div>
<script type="module">
import * as THREE from "three";

function seeded(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color("#0a1426");
scene.fog=new THREE.Fog("#0d1a2e",18,75);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
camera.position.set(0,3.2,14);

const hemi=new THREE.HemisphereLight("#5a76a8","#141a22",0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight("#b9cbff",1.1);
sun.position.set(-22,26,-20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const std=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const mesh=(g,m,p=[0,0,0],shadow=true)=>{const o=new THREE.Mesh(g,m);o.position.set(...p);o.castShadow=shadow;return o;};

// Bintang
{const r=seeded(42),pos=[];for(let i=0;i<1800;i++){const th=r()*Math.PI*2,ph=Math.acos(r()*0.95),R=90;pos.push(R*Math.sin(ph)*Math.cos(th),R*Math.cos(ph),R*Math.sin(ph)*Math.sin(th));}
const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
const starMat=new THREE.PointsMaterial({color:"#dfe8ff",size:0.35,fog:false,transparent:true});scene.add(new THREE.Points(g,starMat));window.starMat=starMat;}

// Bulan
const moon=new THREE.Group();{const m=moon;
m.add(new THREE.Mesh(new THREE.SphereGeometry(3.2,32,32),new THREE.MeshBasicMaterial({color:"#fff6d8",fog:false})));
m.add(new THREE.Mesh(new THREE.SphereGeometry(5.5,32,32),new THREE.MeshBasicMaterial({color:"#fff2c0",transparent:true,opacity:0.12,fog:false})));
scene.add(m);}
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(3.6,32,32),new THREE.MeshBasicMaterial({color:"#fff1c4",fog:false}));scene.add(sunDisc);
const winMats=[],houseLights=[];

// Bukit
[[-25,-45,18,"#132233"],[10,-50,24,"#0f1c2b"],[35,-40,16,"#15263a"]].forEach(([x,z,r,c])=>scene.add(mesh(new THREE.SphereGeometry(r,32,16),std(c),[x,-r*0.55,z],false)));

// Tanah & jalan
{const g=mesh(new THREE.PlaneGeometry(200,200),std("#1c2e24"),[0,0,0],false);g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
const p=mesh(new THREE.PlaneGeometry(2,30),std("#4a4136"),[0,0.01,2],false);p.rotation.x=-Math.PI/2;p.receiveShadow=true;scene.add(p);}

// Rumah
function house(pos,rot=0,s=1,wall="#8a6a4f",roof="#5a2f28"){
  const h=new THREE.Group();h.position.set(...pos);h.rotation.y=rot;h.scale.setScalar(s);
  const b=mesh(new THREE.BoxGeometry(3,2,2.4),std(wall,0.9),[0,1,0]);b.receiveShadow=true;h.add(b);
  const rf=mesh(new THREE.ConeGeometry(2.4,1.3,4),std(roof,0.8),[0,2.6,0]);rf.rotation.y=Math.PI/4;h.add(rf);
  h.add(mesh(new THREE.BoxGeometry(0.4,1,0.4),std("#4a3b33"),[0.9,3,-0.3]));
  const win=new THREE.MeshBasicMaterial({color:"#ffc864"});winMats.push(win);
  [-0.8,0.8].forEach(x=>h.add(mesh(new THREE.PlaneGeometry(0.6,0.6),win,[x,1.2,1.21],false)));
  h.add(mesh(new THREE.PlaneGeometry(0.6,1.2),std("#3a2618"),[0,0.6,1.21],false));
  const l=new THREE.PointLight("#ffb04a",4,7,2);l.position.set(0,1.2,2);h.add(l);houseLights.push(l);
  scene.add(h);
}
house([-4,0,-3],0.3);
house([4.5,0,-5],-0.4,1,"#9c8a70","#3d3a4a");
house([0.5,0,-12],0,1.2,"#7a5c46");
house([-9,0,-14],0.6,0.9,"#a08466","#4a2a22");

// Pohon
{const r=seeded(3);for(let i=0;i<22;i++){const side=r()>0.5?1:-1;const x=side*(6+r()*16),z=-4-r()*22,s=0.8+r()*0.9;
const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);
t.add(mesh(new THREE.CylinderGeometry(0.15,0.2,1,6),std("#3b2a1e"),[0,0.5,0]));
for(let k=0;k<3;k++)t.add(mesh(new THREE.ConeGeometry(1.1-k*0.28,1.4,8),std(k%2?"#1f3d2c":"#24472f"),[0,1.3+k*0.75,0]));
scene.add(t);}}

// Pagar
{const f=new THREE.Group();f.position.z=4.5;const m=std("#6b5040");
for(let i=0;i<14;i++)f.add(mesh(new THREE.BoxGeometry(0.12,0.9,0.12),m,[-9+i*1.4,0.45,0]));
[0.35,0.7].forEach(y=>f.add(mesh(new THREE.BoxGeometry(18.4,0.08,0.06),m,[0.1,y,0])));
scene.add(f);}

// Kunang-kunang
const r7=seeded(7);
const base=Array.from({length:60},()=>[(r7()-0.5)*24,0.4+r7()*2,(r7()-0.5)*14-2,r7()*10]);
const ffGeo=new THREE.BufferGeometry();
ffGeo.setAttribute("position",new THREE.Float32BufferAttribute(new Float32Array(base.length*3),3));
scene.add(new THREE.Points(ffGeo,window.ffMat=new THREE.PointsMaterial({color:"#e8ff8a",size:0.12,transparent:true,opacity:0.9})));

const pointer={x:0,y:0};
addEventListener("pointermove",e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight*2-1);});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});


// ===== Siklus siang-malam =====
const SKY=[[0,"#0a1426"],[4.8,"#101a34"],[5.8,"#4a3a62"],[6.5,"#f2a477"],[7.6,"#a9d0ef"],[12,"#79bdf0"],[16.4,"#a2cbec"],[17.7,"#f39463"],[18.6,"#6a3f6a"],[19.6,"#17203f"],[20.5,"#0a1426"],[24,"#0a1426"]];
const cA=new THREE.Color(),cB=new THREE.Color(),tmp=new THREE.Color();
function skyAt(h){for(let i=0;i<SKY.length-1;i++){const[a,ca]=SKY[i],[b,cb]=SKY[i+1];if(h>=a&&h<=b){cA.set(ca);cB.set(cb);return tmp.copy(cA).lerp(cB,(h-a)/(b-a));}}return tmp.set("#0a1426");}
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const warm=new THREE.Color("#ffb070"),white=new THREE.Color("#fff6e6"),moonC=new THREE.Color("#b9cbff");
function applyTime(h){
  const ang=(h-6)/12*Math.PI; // 0 = terbit, PI = terbenam
  const sx=Math.cos(ang)*-55,sy=Math.sin(ang)*45;
  const day=sm(-0.08,0.25,Math.sin(ang)); // 0 malam, 1 siang
  const low=1-sm(0.05,0.5,Math.abs(Math.sin(ang)));
  sunDisc.position.set(sx,sy,-70);sunDisc.visible=sy>-4;
  moon.position.set(-sx*0.8,-sy*0.6+8,-60);moon.visible=day<0.9;
  const sky=skyAt(h);scene.background.copy(sky);scene.fog.color.copy(sky).multiplyScalar(0.92+0.08*day);
  if(day>0.02){sun.position.set(sx*0.5,Math.max(sy,3)*0.6,-20);sun.color.copy(white).lerp(warm,low);sun.intensity=0.4+2.4*day;}
  else{sun.position.set(-sx*0.4,20,-20);sun.color.copy(moonC);sun.intensity=0.9;}
  hemi.color.set("#5a76a8").lerp(tmp.set("#cfe6ff"),day);hemi.groundColor.set("#141a22").lerp(tmp.set("#4a5a3a"),day);hemi.intensity=0.7+0.6*day;
  window.starMat.opacity=1-sm(0.05,0.6,day);
  const lamp=1-sm(0.2,0.7,day);
  winMats.forEach(m=>m.color.set("#5a5048").lerp(tmp.set("#ffc864"),lamp));
  houseLights.forEach(l=>l.intensity=4*lamp);
  window.ffMat.opacity=0.9*lamp;
  document.getElementById("jam").textContent=String(Math.floor(h)).padStart(2,"0")+":"+String(Math.floor(h%1*60)).padStart(2,"0");
}
let mode="auto",hour=17;const CYCLE=120; // detik per hari
const sl=document.getElementById("sl");
sl.addEventListener("input",()=>{hour=+sl.value;setMode("manual");});
function setMode(m){mode=m;document.querySelectorAll("#ui button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));}
document.querySelectorAll("#ui button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
let last=0;
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime();const dt=Math.min(t-last,0.05);last=t;
  if(mode==="auto")hour=(hour+dt*24/CYCLE)%24;
  else if(mode==="real"){const d=new Date();hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;}
  if(mode!=="manual")sl.value=hour;
  applyTime(hour);
  const a=ffGeo.getAttribute("position");
  base.forEach(([x,y,z,p],i)=>a.setXYZ(i,x+Math.sin(t*0.4+p)*0.6,y+Math.sin(t*0.9+p)*0.3,z+Math.cos(t*0.3+p)*0.6));
  a.needsUpdate=true;
  camera.position.x=Math.sin(t*0.08)*1.5+pointer.x*1.2;
  camera.position.y=3.2+pointer.y*0.5;
  camera.lookAt(0,2.2,-6);
  renderer.render(scene,camera);
});
</script>
</body>
</html>
