<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunset Over the Hills</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#160d31}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#180d3c 0%,#512b68 32%,#c35b78 62%,#ffb479 100%)}
.sun{position:absolute;z-index:2;left:53%;top:43%;width:clamp(100px,16vw,205px);height:clamp(100px,16vw,205px);transform:translate(-50%,-50%);border-radius:50%;background:#ffe5a0;box-shadow:0 0 30px #ffd589,0 0 100px #f9917e,0 0 200px #d95785}.sun:after{content:"";position:absolute;inset:12% 0 0;border-radius:50%;background:repeating-linear-gradient(to bottom,transparent 0 10px,rgba(201,78,105,.22) 11px 16px)}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 8% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 21% 10%,#ffe7ff 0 1.5px,transparent 2.5px),radial-gradient(circle at 38% 17%,#fff 0 1px,transparent 2px),radial-gradient(circle at 72% 9%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 90% 20%,#ffe6f4 0 1px,transparent 2px);opacity:.6;animation:twinkle 4s alternate infinite}@keyframes twinkle{to{opacity:.2}}
.cloud{position:absolute;z-index:3;width:240px;height:34px;border-radius:50px;background:rgba(255,190,184,.18);filter:blur(4px);animation:drift 34s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:100px;height:70px;left:35px;bottom:0}.cloud:after{width:125px;height:75px;right:25px;bottom:0}.c1{top:31%;left:-270px}.c2{top:49%;left:12%;transform:scale(.55);animation-duration:45s;animation-delay:-16s}@keyframes drift{to{margin-left:calc(100vw + 500px)}}
/* cakrawala luas */.horizon{position:absolute;z-index:4;left:-5%;width:110%;bottom:25%;height:25%;background:#55365d;clip-path:polygon(0 68%,10% 56%,20% 63%,29% 48%,39% 61%,49% 50%,59% 64%,70% 44%,80% 58%,91% 47%,100% 59%,100% 100%,0 100%);opacity:.72}.distant{position:absolute;z-index:5;left:-5%;width:110%;bottom:18%;height:27%;background:#302344;clip-path:polygon(0 66%,13% 56%,24% 69%,38% 51%,49% 68%,63% 46%,77% 67%,89% 52%,100% 62%,100% 100%,0 100%)}
/* hill where the camera stands */.hill{position:absolute;z-index:8;left:-8%;bottom:-13%;width:116%;height:48%;background:linear-gradient(150deg,#111329,#090d1d);border-radius:50% 50% 0 0/38% 38% 0 0;transform:rotate(-2deg)}.hill:before{content:"";position:absolute;left:0;right:0;top:14%;height:2px;background:rgba(148,101,117,.35);box-shadow:0 22px rgba(111,76,105,.22),0 46px rgba(80,56,87,.18)}
/* jalur kecil menuju tepi */.path{position:absolute;z-index:9;left:52%;bottom:0;width:23%;height:30%;transform:translateX(-50%);background:linear-gradient(125deg,rgba(171,127,112,.18),rgba(29,25,46,.08));clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);filter:blur(3px)}
/* rerumputan foreground */.grass{position:absolute;z-index:12;bottom:0;width:42%;height:24%;background:repeating-linear-gradient(78deg,transparent 0 18px,#070b18 19px 23px,transparent 24px 38px);clip-path:polygon(0 100%,6% 40%,9% 100%,17% 13%,20% 100%,28% 35%,31% 100%,40% 4%,43% 100%,53% 29%,56% 100%,65% 10%,68% 100%,78% 34%,81% 100%,91% 0,94% 100%)}.left{left:-2%}.right{right:-2%;transform:scaleX(-1)}
/* siluet pohon */.pine{position:absolute;z-index:11;bottom:25%;width:0;height:0;border-left:clamp(20px,2.8vw,44px) solid transparent;border-right:clamp(20px,2.8vw,44px) solid transparent;border-bottom:clamp(100px,21vh,225px) solid #080d1b;filter:drop-shadow(0 0 6px #16142b)}.pine:before{content:"";position:absolute;left:clamp(-36px,-2.3vw,-17px);top:clamp(34px,7vh,72px);border-left:clamp(35px,4.2vw,66px) solid transparent;border-right:clamp(35px,4.2vw,66px) solid transparent;border-bottom:clamp(105px,18vh,195px) solid #070b18}.pine:after{content:"";position:absolute;left:-3px;top:clamp(170px,25vh,270px);width:6px;height:48px;background:#070b16}.p1{left:6%;transform:scale(1.05)}.p2{left:20%;bottom:22%;transform:scale(.52)}.p3{right:6%;transform:scale(1.18)}.p4{right:23%;bottom:23%;transform:scale(.56)}
/* angin tipis dan burung */.wind{position:absolute;z-index:7;left:0;right:0;bottom:31%;height:70px;border-top:2px solid rgba(255,203,180,.22);border-radius:50%;box-shadow:0 17px rgba(255,202,190,.13),0 38px rgba(255,202,190,.1);animation:sway 6s ease-in-out infinite alternate}@keyframes sway{to{transform:translateX(4%) scaleX(.92)}}.bird{position:absolute;z-index:10;width:32px;height:14px}.bird:before,.bird:after{content:"";position:absolute;top:6px;width:18px;height:7px;border-top:3px solid #17132d;border-radius:80% 80% 0 0}.bird:before{right:15px;transform:rotate(18deg)}.bird:after{left:15px;transform:rotate(-18deg)}.b1{left:18%;top:27%;transform:scale(.65)}.b2{left:31%;top:20%;transform:scale(.45)}.b3{left:65%;top:24%;transform:scale(.9)}.b4{left:78%;top:17%;transform:scale(.55)}
</style></head><body><main class="scene"><div class="stars"></div><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><div class="horizon"></div><div class="distant"></div><div class="wind"></div><div class="hill"></div><div class="path"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="bird b1"></i><i class="bird b2"></i><i class="bird b3"></i><i class="bird b4"></i><div class="grass left"></div><div class="grass right"></div></main></body></html>
