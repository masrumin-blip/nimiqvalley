<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Ocean</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#071a2c}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#102f50 0%,#3d7890 38%,#f19b7c 68%,#f8c587 100%)}
.sun{position:absolute;z-index:2;left:67%;top:35%;width:clamp(80px,12vw,155px);height:clamp(80px,12vw,155px);transform:translate(-50%,-50%);border-radius:50%;background:#fff0ae;box-shadow:0 0 28px #ffe39b,0 0 90px #fdb383,0 0 170px #e97782}.sun:after{content:"";position:absolute;inset:13% 0 0;border-radius:50%;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(205,94,106,.22) 10px 15px)}
.stars{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(circle at 8% 16%,#fff 0 1px,transparent 2px),radial-gradient(circle at 22% 9%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 48% 14%,#fff 0 1px,transparent 2px),radial-gradient(circle at 82% 12%,#fff 0 1.5px,transparent 2px);animation:twinkle 4s alternate infinite}@keyframes twinkle{to{opacity:.18}}
.cloud{position:absolute;z-index:3;width:220px;height:32px;border-radius:50px;background:rgba(255,215,190,.2);filter:blur(4px);animation:drift 34s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:95px;height:64px;left:30px;bottom:0}.cloud:after{width:120px;height:70px;right:18px;bottom:0}.c1{top:25%;left:-250px}.c2{top:47%;left:13%;transform:scale(.6);animation-delay:-17s;animation-duration:46s}@keyframes drift{to{margin-left:calc(100vw + 500px)}}
.horizon{position:absolute;z-index:4;left:0;right:0;top:55%;height:2px;background:rgba(255,222,177,.6);box-shadow:0 0 18px rgba(255,183,142,.7)}.sea{position:absolute;z-index:5;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#4e8d96,#236276 40%,#0b354d 100%)}.sea:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(178deg,transparent 0 17px,rgba(161,229,211,.22) 18px 20px,transparent 21px 39px);background-size:100% 90px;animation:water 7s linear infinite}@keyframes water{to{background-position:40px 90px}}
.reflection{position:absolute;z-index:6;left:67%;bottom:0;width:clamp(130px,20vw,280px);height:46%;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,218,154,.7) 20%,rgba(247,150,126,.17));filter:blur(10px);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);animation:reflect 4s ease-in-out infinite alternate}@keyframes reflect{to{transform:translateX(-50%) scaleX(.78);opacity:.65}}
.wave{position:absolute;z-index:7;left:-5%;width:110%;height:70px;border-top:3px solid rgba(195,247,224,.5);border-radius:50%;animation:wave 5s ease-in-out infinite alternate}.w1{bottom:26%;}.w2{bottom:17%;transform:scaleX(.8);animation-delay:-2s}.w3{bottom:7%;transform:scaleX(1.15);animation-delay:-4s}@keyframes wave{to{transform:translateX(4%) scaleX(.94);opacity:.35}}
.boat{position:absolute;z-index:9;left:27%;bottom:39%;width:80px;height:18px;background:#112536;border-radius:0 0 60% 60%;transform:skewX(-12deg)}.boat:before{content:"";position:absolute;left:38px;bottom:14px;width:2px;height:66px;background:#142638}.boat:after{content:"";position:absolute;left:40px;bottom:29px;border-left:30px solid transparent;border-bottom:42px solid rgba(239,226,184,.75);filter:drop-shadow(0 0 5px #f6d9a0)}
.bird{position:absolute;z-index:8;width:30px;height:13px}.bird:before,.bird:after{content:"";position:absolute;top:5px;width:17px;height:7px;border-top:3px solid #1b2031;border-radius:80% 80% 0 0}.bird:before{right:14px;transform:rotate(18deg)}.bird:after{left:14px;transform:rotate(-18deg)}.b1{left:20%;top:31%;transform:scale(.6)}.b2{left:39%;top:20%;transform:scale(.45)}.b3{left:51%;top:29%;transform:scale(.85)}.b4{left:83%;top:19%;transform:scale(.55)}.b5{left:91%;top:32%;transform:scale(.4)}
.foam{position:absolute;z-index:10;bottom:0;width:38%;height:17%;background:repeating-linear-gradient(79deg,transparent 0 18px,rgba(164,229,211,.32) 19px 22px,transparent 23px 42px);clip-path:polygon(0 100%,7% 40%,10% 100%,19% 13%,22% 100%,33% 36%,36% 100%,47% 4%,50% 100%,62% 30%,65% 100%,78% 8%,81% 100%,92% 26%,95% 100%)}.left{left:0}.right{right:0;transform:scaleX(-1)}
</style></head><body><main class="scene"><div class="stars"></div><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><div class="horizon"></div><div class="sea"></div><div class="reflection"></div><i class="wave w1"></i><i class="wave w2"></i><i class="wave w3"></i><i class="boat"></i><i class="bird b1"></i><i class="bird b2"></i><i class="bird b3"></i><i class="bird b4"></i><i class="bird b5"></i><div class="foam left"></div><div class="foam right"></div></main></body></html>
