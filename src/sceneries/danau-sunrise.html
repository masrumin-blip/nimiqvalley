<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunrise Lake</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#14243a}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#10243d 0%,#396078 30%,#f49a76 67%,#ffd18e 100%)}
.sun{position:absolute;z-index:2;left:52%;top:34%;width:clamp(85px,13vw,170px);height:clamp(85px,13vw,170px);transform:translate(-50%,-50%);border-radius:50%;background:#fff0ae;box-shadow:0 0 28px #ffe18e,0 0 90px #ffb978,0 0 160px #ef8886}.sun:after{content:"";position:absolute;inset:12% 0 0;border-radius:50%;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(235,120,105,.23) 10px 14px)}
.star{position:absolute;z-index:1;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:twinkle 3s infinite alternate}.s1{left:10%;top:14%}.s2{left:25%;top:8%;animation-delay:1s}.s3{left:79%;top:12%;animation-delay:1.7s}.s4{left:91%;top:22%;animation-delay:.5s}.s5{left:61%;top:7%;animation-delay:2s}.s6{left:43%;top:17%;animation-delay:1.2s}@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
.cloud{position:absolute;z-index:3;height:30px;width:190px;border-radius:50px;background:rgba(255,221,190,.24);filter:blur(3px);animation:cloud 38s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:85px;height:60px;left:30px;bottom:0}.cloud:after{width:105px;height:64px;right:18px;bottom:0}.c1{top:24%;left:-230px}.c2{top:44%;left:15%;transform:scale(.6);animation-duration:50s;animation-delay:-17s}@keyframes cloud{to{margin-left:calc(100vw + 450px)}}
.hill{position:absolute;left:-5%;width:110%;clip-path:polygon(0 100%,0 57%,11% 43%,21% 67%,33% 27%,45% 64%,56% 41%,67% 69%,78% 25%,90% 60%,100% 43%,100% 100%)}.far{z-index:3;bottom:31%;height:40%;background:#547080;opacity:.85}.near{z-index:5;bottom:22%;height:35%;background:#293b4b;clip-path:polygon(0 100%,0 64%,14% 49%,26% 73%,39% 34%,52% 69%,66% 30%,77% 71%,90% 42%,100% 62%,100% 100%)}
.lake{position:absolute;z-index:4;left:0;bottom:0;width:100%;height:31%;background:linear-gradient(#e58b78,#a96772 31%,#38546a 76%,#152a42)}.reflection{position:absolute;z-index:5;left:52%;bottom:2%;width:clamp(170px,30vw,430px);height:28%;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,235,169,.8) 38%,rgba(242,153,120,.2));filter:blur(10px);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.ripple{position:absolute;z-index:6;left:52%;height:4px;transform:translateX(-50%);border-top:2px solid rgba(255,229,174,.6);border-radius:50%;animation:water 3s ease-in-out infinite alternate}.r1{bottom:22%;width:24%}.r2{bottom:16%;width:39%;animation-delay:-1s}.r3{bottom:9%;width:56%;animation-delay:-2s}@keyframes water{to{transform:translateX(-50%) scaleX(.8);opacity:.4}}
.island{position:absolute;z-index:7;bottom:24%;left:7%;width:33%;height:5%;background:#162738;border-radius:50%;filter:blur(1px)}.island.i2{left:auto;right:5%;width:25%;bottom:27%}
.pine{position:absolute;z-index:8;bottom:20%;width:0;height:0;border-left:clamp(20px,2.8vw,45px) solid transparent;border-right:clamp(20px,2.8vw,45px) solid transparent;border-bottom:clamp(100px,22vh,230px) solid #102534;filter:drop-shadow(0 0 5px #29425a)}.pine:before{content:"";position:absolute;left:clamp(-37px,-2.3vw,-17px);top:clamp(34px,7vh,75px);border-left:clamp(36px,4.3vw,68px) solid transparent;border-right:clamp(36px,4.3vw,68px) solid transparent;border-bottom:clamp(105px,18vh,200px) solid #0c2030}.pine:after{content:"";position:absolute;left:-3px;top:clamp(170px,25vh,275px);width:6px;height:48px;background:#10202b}.p1{left:4%;transform:scale(1.08)}.p2{left:17%;bottom:21%;transform:scale(.58)}.p3{right:4%;transform:scale(1.2)}.p4{right:19%;bottom:23%;transform:scale(.55)}
/* burung terbang */.bird{position:absolute;z-index:10;width:30px;height:13px;filter:drop-shadow(0 0 4px rgba(20,20,35,.6));animation:fly 7s ease-in-out infinite}.bird:before,.bird:after{content:"";position:absolute;top:5px;width:17px;height:7px;border-top:3px solid #172033;border-radius:60% 60% 0 0}.bird:before{right:14px;transform:rotate(18deg)}.bird:after{left:14px;transform:rotate(-18deg)}.b1{left:12%;top:27%;transform:scale(.8);animation-delay:-1s}.b2{left:20%;top:19%;transform:scale(.55);animation-delay:-4s}.b3{left:30%;top:30%;transform:scale(1.1);animation-delay:-2s}.b4{left:38%;top:16%;transform:scale(.65);animation-delay:-6s}.b5{left:47%;top:23%;transform:scale(.8);animation-delay:-3s}.b6{left:57%;top:14%;transform:scale(.5);animation-delay:-5s}.b7{left:65%;top:28%;transform:scale(1.25);animation-delay:-1.7s}.b8{left:73%;top:20%;transform:scale(.7);animation-delay:-4.4s}.b9{left:82%;top:31%;transform:scale(.55);animation-delay:-.8s}.b10{left:88%;top:16%;transform:scale(.9);animation-delay:-3.5s}.b11{left:27%;top:11%;transform:scale(.4);animation-delay:-6.5s}.b12{left:69%;top:9%;transform:scale(.45);animation-delay:-2.7s}@keyframes fly{0%,100%{margin-left:0;transform:translateY(0)}50%{margin-left:18px;transform:translateY(-8px)}}
/* ikan meloncat dan berenang di danau */.fish{position:absolute;z-index:12;width:42px;height:16px;border-radius:60% 55% 55% 60%;background:#f6b676;box-shadow:0 0 8px rgba(255,190,120,.45);animation:swim 8s linear infinite}.fish:before{content:"";position:absolute;right:-13px;top:1px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:16px solid #e9946b}.fish:after{content:"";position:absolute;left:9px;top:4px;width:4px;height:4px;border-radius:50%;background:#24334a}.f1{left:-60px;bottom:11%;transform:scale(.75);animation-delay:-1s}.f2{left:-90px;bottom:17%;transform:scale(.48);animation-delay:-4s}.f3{left:-70px;bottom:7%;transform:scale(1.1);animation-delay:-6s}.f4{left:-55px;bottom:14%;transform:scale(.6);animation-delay:-2.5s}@keyframes swim{to{left:110%}}.splash{position:absolute;z-index:11;left:73%;bottom:17%;width:28px;height:30px;border-left:2px solid rgba(218,244,226,.8);border-right:2px solid rgba(218,244,226,.8);border-radius:50%;transform:rotate(22deg);animation:splash 2.5s ease-in-out infinite}.splash:after{content:"";position:absolute;left:-22px;bottom:-12px;width:68px;height:8px;border-top:2px solid rgba(230,245,220,.7);border-radius:50%}@keyframes splash{0%,100%{opacity:.15;transform:translateY(8px) rotate(22deg)}45%{opacity:.9;transform:translateY(-8px) rotate(22deg)}}
.reeds{position:absolute;z-index:13;bottom:0;width:35%;height:14%;opacity:.9;background:repeating-linear-gradient(83deg,transparent 0 12px,#102331 13px 16px,transparent 17px 25px);clip-path:polygon(0 100%,8% 20%,10% 100%,20% 0,22% 100%,33% 29%,35% 100%,48% 8%,50% 100%,63% 22%,65% 100%,78% 4%,80% 100%,92% 25%,95% 100%)}.left{left:0}.right{right:0;transform:scaleX(-1)}
</style></head><body><main class="scene"><i class="sun"></i><i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="star s5"></i><i class="star s6"></i><i class="cloud c1"></i><i class="cloud c2"></i><div class="hill far"></div><div class="hill near"></div><div class="lake"></div><div class="reflection"></div><i class="ripple r1"></i><i class="ripple r2"></i><i class="ripple r3"></i><div class="island"></div><div class="island i2"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="bird b1"></i><i class="bird b2"></i><i class="bird b3"></i><i class="bird b4"></i><i class="bird b5"></i><i class="bird b6"></i><i class="bird b7"></i><i class="bird b8"></i><i class="bird b9"></i><i class="bird b10"></i><i class="bird b11"></i><i class="bird b12"></i><i class="fish f1"></i><i class="fish f2"></i><i class="fish f3"></i><i class="fish f4"></i><i class="splash"></i><div class="reeds left"></div><div class="reeds right"></div></main></body></html>
