<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest Hills at Dusk</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#42647a}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog("#c99a8e", 40, 170);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 800);
camera.position.set(0, 7, 34); camera.lookAt(0, 6, -60);

const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vDir; void main(){ float h=clamp(vDir.y,0.0,1.0);
    vec3 c=mix(vec3(0.97,0.74,0.51),vec3(0.70,0.48,0.52),smoothstep(0.0,0.15,h));
    c=mix(c,vec3(0.26,0.39,0.48),smoothstep(0.15,0.6,h));
    vec3 sd=normalize(vec3(-0.05,0.05,-1.0)); float d=max(dot(normalize(vDir),sd),0.0);
    c+=vec3(1.0,0.9,0.7)*pow(d,500.0)*2.5+vec3(1.0,0.7,0.45)*pow(d,10.0)*0.35;
    gl_FragColor=vec4(c,1.0); }`
}));
scene.add(sky);
scene.add(new THREE.HemisphereLight("#f8bd83", "#324f47", 1.1));
const sun = new THREE.DirectionalLight("#ffe7b0", 1.4); sun.position.set(-5, 8, -40); scene.add(sun);

function terrainHeight(x, z) {
  const left = 11.8 * Math.exp(-Math.pow((x + 22 + z * 0.1) / 19, 2));
  const right = 13.6 * Math.exp(-Math.pow((x - 26 - z * 0.075) / 22, 2));
  const rear = 2.1 * Math.exp(-Math.pow((z + 74) / 34, 2));
  return -3 + left + right + rear + 0.78 * Math.sin(x * 0.16 + z * 0.075) + 0.39 * Math.sin(x * 0.37 - z * 0.18);
}
const g = new THREE.PlaneGeometry(220, 220, 90, 90); g.rotateX(-Math.PI / 2);
const pos = g.attributes.position; const colors = [];
const low = new THREE.Color("#324f47"), high = new THREE.Color("#77917a"), c = new THREE.Color();
for (let i = 0; i < pos.count; i++) { const h = terrainHeight(pos.getX(i), pos.getZ(i)); pos.setY(i, h); c.copy(low).lerp(high, THREE.MathUtils.clamp((h + 3) / 14, 0, 1)); colors.push(c.r, c.g, c.b); }
g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3)); g.computeVertexNormals();
scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));

// distant ridge
const ridge = new THREE.Mesh(new THREE.PlaneGeometry(600, 60, 60, 1), new THREE.MeshBasicMaterial({ color: "#786f85", fog: false }));
const rp = ridge.geometry.attributes.position;
for (let i = 0; i < rp.count; i++) if (rp.getY(i) > 0) rp.setY(i, 6 + 8 * Math.sin(rp.getX(i) * 0.03) + 4 * Math.sin(rp.getX(i) * 0.11));
ridge.position.set(0, 0, -160); scene.add(ridge);

// pines (instanced)
const N = 420; const rnd = (n) => { const v = Math.sin(n * 127.1 + 78.233) * 43758.5453; return v - Math.floor(v); };
const cone = new THREE.ConeGeometry(1, 3.2, 6); cone.translate(0, 2.2, 0);
const pines = new THREE.InstancedMesh(cone, new THREE.MeshLambertMaterial({ color: "#ffffff" }), N);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();
const pal = ["#173f3d", "#32645a", "#648576"].map((h) => new THREE.Color(h));
let k = 0;
for (let i = 0; k < N && i < N * 4; i++) {
  const x = (rnd(i) - 0.5) * 200, z = -rnd(i + 99) * 120 + 10;
  const h = terrainHeight(x, z); if (h < 1.5 && rnd(i + 7) > 0.25) continue;
  const s = 0.8 + rnd(i + 3) * 1.1;
  m.compose(p.set(x, h - 0.3, z), q, sc.set(s, s * (1 + rnd(i + 5) * 0.5), s));
  pines.setMatrixAt(k, m); pines.setColorAt(k, pal[Math.floor(rnd(i + 11) * 3)]); k++;
}
pines.count = k; scene.add(pines);

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
function loop(){ const t = clock.getElapsedTime(); camera.position.x = Math.sin(t * 0.05) * 3; camera.lookAt(0, 6, -60); renderer.render(scene, camera); }
renderer.setAnimationLoop(loop);
document.addEventListener("visibilitychange", () => renderer.setAnimationLoop(document.hidden ? null : loop));
</script>
</body></html>
