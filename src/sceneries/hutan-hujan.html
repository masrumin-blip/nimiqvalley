<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misty Rainforest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#08151b}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#172f38 0%,#31595b 36%,#739083 68%,#a4b69c 100%)}
/* cahaya lembut di balik kabut */
.glow{position:absolute;left:55%;top:25%;width:clamp(180px,35vw,480px);height:clamp(180px,35vw,480px);transform:translate(-50%,-50%);border-radius:50%;background:rgba(220,239,205,.3);filter:blur(35px)}
/* kabut berlapis */
.fog{position:absolute;left:-15%;width:130%;height:clamp(60px,12vh,130px);border-radius:50%;background:rgba(218,236,211,.25);filter:blur(18px);animation:float 12s ease-in-out infinite alternate}.f1{top:33%;animation-duration:15s}.f2{top:50%;opacity:.65;animation-delay:-5s;animation-duration:19s}.f3{top:68%;opacity:.55;animation-delay:-9s;animation-duration:13s}@keyframes float{to{transform:translateX(8%) scaleY(1.2)}}
/* rintik hujan */
.rain{position:absolute;inset:-15% 0 0;background-image:repeating-linear-gradient(106deg,transparent 0 22px,rgba(210,240,235,.32) 23px,transparent 25px 58px);background-size:115px 150px;opacity:.58;animation:rain 1.3s linear infinite;transform:skewX(-8deg)}.rain.r2{background-size:190px 210px;opacity:.25;animation-duration:.85s;animation-delay:-.3s}.rain.r3{background-size:80px 100px;opacity:.18;animation-duration:.55s;animation-delay:-.1s}@keyframes rain{to{background-position:0 150px}}
/* pegunungan jauh */
.hills{position:absolute;left:-5%;bottom:27%;width:110%;height:47%;background:#385d5c;opacity:.48;clip-path:polygon(0 100%,0 55%,13% 42%,24% 66%,38% 27%,50% 63%,64% 36%,75% 64%,88% 25%,100% 53%,100% 100%)}.hills:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 48%,rgba(194,219,191,.32) 49% 51%,transparent 52%);opacity:.55}
/* lapisan tanah */
.ground{position:absolute;left:0;bottom:0;width:100%;height:28%;background:linear-gradient(#294b40,#102c29 70%,#071b1d)}.path{position:absolute;bottom:-5%;left:48%;width:25%;height:42%;transform:translateX(-50%);background:linear-gradient(105deg,rgba(177,178,132,.18),rgba(89,116,91,.25));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);filter:blur(3px)}
/* pohon pinus siluet */
.pine{position:absolute;bottom:20%;width:0;height:0;border-left:clamp(22px,3vw,48px) solid transparent;border-right:clamp(22px,3vw,48px) solid transparent;border-bottom:clamp(100px,22vh,240px) solid #0d2929;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))}.pine:before{content:"";position:absolute;left:clamp(-38px,-2.4vw,-18px);top:clamp(35px,7vh,75px);border-left:clamp(38px,4.5vw,70px) solid transparent;border-right:clamp(38px,4.5vw,70px) solid transparent;border-bottom:clamp(110px,19vh,205px) solid #0b2426}.pine:after{content:"";position:absolute;left:-3px;top:clamp(170px,25vh,275px);width:6px;height:50px;background:#102522}.p1{left:4%;transform:scale(.85)}.p2{left:15%;bottom:18%;transform:scale(.52);opacity:.9}.p3{left:29%;bottom:22%;transform:scale(.7);opacity:.9}.p4{right:4%;transform:scale(1.05)}.p5{right:18%;bottom:18%;transform:scale(.62)}.p6{right:31%;bottom:23%;transform:scale(.45);opacity:.8}
/* semak foreground */
.bush{position:absolute;bottom:11%;width:18vw;height:12vw;max-width:250px;max-height:150px;border-radius:50% 50% 20% 20%;background:#102e2a;box-shadow:35px 12px 0 #163a31,-35px 15px 0 #0d2828}.b1{left:-4%}.b2{right:-5%;transform:scale(1.35)}
/* tetes besar di depan */
.drops{position:absolute;inset:0;background-image:radial-gradient(ellipse at 14% 26%,rgba(222,250,241,.7) 0 2px,transparent 3px),radial-gradient(ellipse at 74% 44%,rgba(222,250,241,.6) 0 2px,transparent 3px),radial-gradient(ellipse at 42% 72%,rgba(222,250,241,.45) 0 1.5px,transparent 3px),radial-gradient(ellipse at 92% 18%,rgba(222,250,241,.7) 0 2px,transparent 3px);background-size:210px 250px,290px 310px,170px 190px,250px 280px;animation:drops 2.5s linear infinite;opacity:.48}@keyframes drops{to{background-position:20px 250px,-15px 310px,12px 190px,-20px 280px}}
</style></head>
<body><main class="scene"><div class="glow"></div><div class="hills"></div><div class="fog f1"></div><div class="fog f2"></div><div class="fog f3"></div><div class="path"></div><div class="ground"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="pine p5"></i><i class="pine p6"></i><div class="bush b1"></div><div class="bush b2"></div><div class="rain"></div><div class="rain r2"></div><div class="rain r3"></div><div class="drops"></div></main></body></html>
