<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Night</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#030711}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#020611 0%,#081a2b 45%,#102e3b 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 8% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 18% 8%,#d8ffff 0 1.5px,transparent 2.5px),radial-gradient(circle at 31% 21%,#fff 0 1px,transparent 2px),radial-gradient(circle at 44% 10%,#bff 0 1px,transparent 2px),radial-gradient(circle at 57% 19%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 69% 7%,#dff 0 1px,transparent 2px),radial-gradient(circle at 83% 16%,#fff 0 1px,transparent 2px),radial-gradient(circle at 94% 28%,#dff 0 1.5px,transparent 2px),radial-gradient(circle at 73% 34%,#fff 0 1px,transparent 2px);animation:twinkle 4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.45}}
.moon{position:absolute;z-index:4;right:12%;top:12%;width:clamp(52px,8vw,105px);height:clamp(52px,8vw,105px);border-radius:50%;background:#e8fbef;box-shadow:0 0 20px #d2fff3,0 0 70px rgba(137,255,222,.45)}.moon:after{content:"";position:absolute;background:#07182a;width:100%;height:100%;border-radius:50%;left:22%;top:-8%}
.aurora{position:absolute;z-index:2;top:-12%;left:-15%;width:130%;height:78%;filter:blur(12px);opacity:.82;transform:rotate(-3deg);background:linear-gradient(112deg,transparent 8%,rgba(0,255,184,.03) 18%,rgba(0,255,201,.43) 28%,rgba(78,255,199,.1) 36%,transparent 44%,rgba(120,119,255,.08) 50%,rgba(111,255,213,.48) 61%,rgba(21,193,255,.08) 70%,transparent 78%);animation:aurora 13s ease-in-out infinite alternate}.aurora:before{content:"";position:absolute;inset:4% 0;background:linear-gradient(100deg,transparent 14%,rgba(159,255,215,.32) 27%,transparent 39%,rgba(128,183,255,.25) 55%,transparent 67%,rgba(63,255,200,.3) 79%,transparent 91%);filter:blur(18px);animation:sway 9s ease-in-out infinite alternate}@keyframes aurora{to{transform:translateX(6%) rotate(5deg) scaleY(1.12);opacity:.96}}@keyframes sway{to{transform:translateX(-7%) skewX(7deg)}}
.hill{position:absolute;z-index:5;left:-5%;width:110%;bottom:23%;height:39%;background:#0b1d2b;clip-path:polygon(0 100%,0 63%,11% 48%,22% 70%,34% 30%,47% 65%,58% 41%,70% 70%,82% 27%,92% 59%,100% 45%,100% 100%)}.hill.back{bottom:29%;height:35%;background:#133344;opacity:.7;clip-path:polygon(0 100%,0 58%,15% 38%,27% 69%,40% 27%,53% 63%,67% 34%,78% 68%,90% 30%,100% 55%,100% 100%)}
.lake{position:absolute;z-index:6;bottom:0;left:0;width:100%;height:28%;background:linear-gradient(#123c4a,#071b2a 55%,#030d18)}.lake:before{content:"";position:absolute;left:0;right:0;top:19%;height:2px;background:rgba(108,255,218,.25);box-shadow:0 20px rgba(92,219,218,.13),0 48px rgba(94,182,204,.1),0 78px rgba(73,169,193,.12)}.reflection{position:absolute;z-index:7;left:44%;bottom:1%;width:32%;height:24%;background:linear-gradient(transparent,rgba(40,255,201,.28),rgba(95,127,255,.16));filter:blur(12px);clip-path:polygon(37% 0,63% 0,100% 100%,0 100%);animation:reflection 5s ease-in-out infinite alternate}@keyframes reflection{to{transform:scaleX(.8);opacity:.65}}
.pine{position:absolute;z-index:9;bottom:18%;width:0;height:0;border-left:clamp(21px,3vw,47px) solid transparent;border-right:clamp(21px,3vw,47px) solid transparent;border-bottom:clamp(105px,23vh,245px) solid #04131e;filter:drop-shadow(0 0 5px #0c2932)}.pine:before{content:"";position:absolute;left:clamp(-38px,-2.4vw,-18px);top:clamp(35px,7vh,75px);border-left:clamp(37px,4.5vw,70px) solid transparent;border-right:clamp(37px,4.5vw,70px) solid transparent;border-bottom:clamp(110px,19vh,208px) solid #03111c}.pine:after{content:"";position:absolute;left:-3px;top:clamp(175px,26vh,280px);width:6px;height:50px;background:#06121b}.p1{left:3%;transform:scale(1.1)}.p2{left:16%;bottom:20%;transform:scale(.6)}.p3{right:3%;transform:scale(1.25)}.p4{right:19%;bottom:21%;transform:scale(.62)}.p5{left:35%;bottom:23%;transform:scale(.42)}
.fog{position:absolute;z-index:8;left:-10%;bottom:23%;width:120%;height:75px;border-radius:50%;background:rgba(156,224,208,.12);filter:blur(20px);animation:fog 11s ease-in-out infinite alternate}@keyframes fog{to{transform:translateX(8%) scaleY(1.25)}}
.boat{position:absolute;z-index:11;bottom:29%;left:53%;width:75px;height:17px;background:#050b12;border-radius:0 0 60% 60%;transform:skewX(-12deg)}.boat:before{content:"";position:absolute;left:35px;bottom:13px;width:2px;height:58px;background:#06131d}.boat:after{content:"";position:absolute;left:37px;bottom:27px;border-left:23px solid transparent;border-bottom:32px solid rgba(111,237,209,.22);filter:drop-shadow(0 0 8px #54eacb)}
.grass{position:absolute;z-index:12;bottom:0;width:35%;height:14%;opacity:.95;background:repeating-linear-gradient(83deg,transparent 0 13px,#04121b 14px 17px,transparent 18px 26px);clip-path:polygon(0 100%,8% 20%,10% 100%,20% 0,22% 100%,33% 29%,35% 100%,48% 8%,50% 100%,63% 22%,65% 100%,78% 4%,80% 100%,92% 25%,95% 100%)}.left{left:0}.right{right:0;transform:scaleX(-1)}
</style></head><body><main class="scene"><div class="stars"></div><i class="moon"></i><div class="aurora"></div><div class="hill back"></div><div class="hill"></div><div class="fog"></div><div class="lake"></div><div class="reflection"></div><i class="boat"></i><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="pine p5"></i><div class="grass left"></div><div class="grass right"></div></main></body></html>
