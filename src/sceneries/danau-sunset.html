<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Lake</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#120b25}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#21163f 0%,#6f3f68 34%,#ed826c 67%,#f7bd79 100%)}
.sun{position:absolute;z-index:2;left:50%;top:35%;width:clamp(90px,13vw,170px);height:clamp(90px,13vw,170px);transform:translate(-50%,-50%);border-radius:50%;background:#ffe18a;box-shadow:0 0 25px #ffd477,0 0 85px #fa9970,0 0 160px #e76578}.sun:after{content:"";position:absolute;inset:12% 0 0;border-radius:50%;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(230,91,99,.25) 10px 14px)}
.star{position:absolute;z-index:1;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:twinkle 3s infinite alternate}.s1{left:9%;top:16%}.s2{left:24%;top:9%;animation-delay:1s}.s3{left:79%;top:13%;animation-delay:1.7s}.s4{left:91%;top:24%;animation-delay:.5s}.s5{left:60%;top:8%;animation-delay:2s}.s6{left:43%;top:18%;animation-delay:1.2s}@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}
.cloud{position:absolute;z-index:3;height:30px;width:190px;border-radius:50px;background:rgba(255,188,172,.2);filter:blur(3px);animation:cloud 36s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:85px;height:60px;left:30px;bottom:0}.cloud:after{width:105px;height:64px;right:18px;bottom:0}.c1{top:23%;left:-230px}.c2{top:43%;left:16%;transform:scale(.6);animation-duration:48s;animation-delay:-17s}@keyframes cloud{to{margin-left:calc(100vw + 450px)}}
.hill{position:absolute;left:-5%;width:110%;clip-path:polygon(0 100%,0 57%,11% 43%,21% 67%,33% 27%,45% 64%,56% 41%,67% 69%,78% 25%,90% 60%,100% 43%,100% 100%)}.far{z-index:3;bottom:31%;height:40%;background:#5b416d;opacity:.82}.near{z-index:5;bottom:22%;height:35%;background:#292548;clip-path:polygon(0 100%,0 64%,14% 49%,26% 73%,39% 34%,52% 69%,66% 30%,77% 71%,90% 42%,100% 62%,100% 100%)}
.lake{position:absolute;z-index:4;left:0;bottom:0;width:100%;height:31%;background:linear-gradient(#c8706d,#7c5366 31%,#27334e 76%,#111e35)}.reflection{position:absolute;z-index:5;left:50%;bottom:2%;width:clamp(170px,30vw,430px);height:28%;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,204,130,.72) 38%,rgba(239,134,111,.18));filter:blur(10px);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.ripple{position:absolute;z-index:6;left:50%;height:4px;transform:translateX(-50%);border-top:2px solid rgba(255,218,153,.55);border-radius:50%;animation:water 3s ease-in-out infinite alternate}.r1{bottom:22%;width:24%}.r2{bottom:16%;width:39%;animation-delay:-1s}.r3{bottom:9%;width:56%;animation-delay:-2s}@keyframes water{to{transform:translateX(-50%) scaleX(.8);opacity:.4}}
.island{position:absolute;z-index:7;bottom:24%;left:7%;width:33%;height:5%;background:#171d2d;border-radius:50%;filter:blur(1px)}.island.i2{left:auto;right:5%;width:25%;bottom:27%}
/* siluet pohon dan rumput */
.pine{position:absolute;z-index:8;bottom:20%;width:0;height:0;border-left:clamp(20px,2.8vw,45px) solid transparent;border-right:clamp(20px,2.8vw,45px) solid transparent;border-bottom:clamp(100px,22vh,230px) solid #111b29;filter:drop-shadow(0 0 5px #1a2740)}.pine:before{content:"";position:absolute;left:clamp(-37px,-2.3vw,-17px);top:clamp(34px,7vh,75px);border-left:clamp(36px,4.3vw,68px) solid transparent;border-right:clamp(36px,4.3vw,68px) solid transparent;border-bottom:clamp(105px,18vh,200px) solid #0d1928}.pine:after{content:"";position:absolute;left:-3px;top:clamp(170px,25vh,275px);width:6px;height:48px;background:#101523}.p1{left:4%;transform:scale(1.08)}.p2{left:17%;bottom:21%;transform:scale(.58)}.p3{right:4%;transform:scale(1.2)}.p4{right:19%;bottom:23%;transform:scale(.55)}
/* banyak burung berbentuk V */
.bird{position:absolute;z-index:10;width:30px;height:13px;filter:drop-shadow(0 0 4px rgba(20,12,35,.5));animation:fly 7s ease-in-out infinite}.bird:before,.bird:after{content:"";position:absolute;top:5px;width:17px;height:7px;border-top:3px solid #171329;border-radius:60% 60% 0 0}.bird:before{right:14px;transform:rotate(18deg)}.bird:after{left:14px;transform:rotate(-18deg)}.b1{left:13%;top:27%;transform:scale(.8);animation-delay:-1s}.b2{left:21%;top:19%;transform:scale(.55);animation-delay:-4s}.b3{left:31%;top:30%;transform:scale(1.1);animation-delay:-2s}.b4{left:39%;top:16%;transform:scale(.65);animation-delay:-6s}.b5{left:48%;top:23%;transform:scale(.8);animation-delay:-3s}.b6{left:58%;top:14%;transform:scale(.5);animation-delay:-5s}.b7{left:66%;top:28%;transform:scale(1.25);animation-delay:-1.7s}.b8{left:74%;top:20%;transform:scale(.7);animation-delay:-4.4s}.b9{left:83%;top:31%;transform:scale(.55);animation-delay:-.8s}.b10{left:89%;top:16%;transform:scale(.9);animation-delay:-3.5s}.b11{left:28%;top:11%;transform:scale(.4);animation-delay:-6.5s}.b12{left:70%;top:9%;transform:scale(.45);animation-delay:-2.7s}@keyframes fly{0%,100%{margin-left:0;transform:translateY(0)}50%{margin-left:18px;transform:translateY(-8px)}}
.reeds{position:absolute;z-index:11;bottom:0;width:35%;height:14%;opacity:.9;background:repeating-linear-gradient(83deg,transparent 0 12px,#101d2a 13px 16px,transparent 17px 25px);clip-path:polygon(0 100%,8% 20%,10% 100%,20% 0,22% 100%,33% 29%,35% 100%,48% 8%,50% 100%,63% 22%,65% 100%,78% 4%,80% 100%,92% 25%,95% 100%)}.reeds.left{left:0}.reeds.right{right:0;transform:scaleX(-1)}
</style></head>
<body><main class="scene"><i class="sun"></i><i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="star s5"></i><i class="star s6"></i><i class="cloud c1"></i><i class="cloud c2"></i><div class="hill far"></div><div class="hill near"></div><div class="lake"></div><div class="reflection"></div><i class="ripple r1"></i><i class="ripple r2"></i><i class="ripple r3"></i><div class="island"></div><div class="island i2"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="bird b1"></i><i class="bird b2"></i><i class="bird b3"></i><i class="bird b4"></i><i class="bird b5"></i><i class="bird b6"></i><i class="bird b7"></i><i class="bird b8"></i><i class="bird b9"></i><i class="bird b10"></i><i class="bird b11"></i><i class="bird b12"></i><div class="reeds left"></div><div class="reeds right"></div></main></body></html>
