<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Dusk</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a2340}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 1000);
camera.position.set(0, 6, 30); camera.lookAt(0, 4, -100);
const sunDir = new THREE.Vector3(0.15, 0.06, -1).normalize();

const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { uSun: { value: sunDir } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uSun; varying vec3 vDir;
  void main(){ float h = clamp(vDir.y,0.0,1.0);
    vec3 col = mix(vec3(1.0,0.66,0.42), vec3(0.85,0.45,0.5), smoothstep(0.0,0.12,h));
    col = mix(col, vec3(0.2,0.24,0.42), smoothstep(0.12,0.55,h));
    float d = max(dot(normalize(vDir), uSun),0.0);
    col += vec3(1.0,0.85,0.55)*pow(d,600.0)*3.0 + vec3(1.0,0.6,0.35)*pow(d,12.0)*0.45;
    gl_FragColor = vec4(col,1.0); }`
}));
scene.add(sky);

const ocean = new THREE.Mesh(new THREE.PlaneGeometry(400, 400, 72, 72), new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uSun: { value: sunDir }, uCam: { value: camera.position } },
  vertexShader: `uniform float uTime; varying vec3 vW; varying vec3 vN;
  float wv(vec2 p){ return sin(p.x*0.16+p.y*0.08+uTime*0.6)*0.5+sin(p.x*-0.07+p.y*0.21+uTime*0.8)*0.3+sin(p.x*0.31-p.y*0.19+uTime*1.1)*0.15; }
  void main(){ vec3 p = position; float h = wv(p.xy); p.z += h;
    float e=0.2; float hx=wv(p.xy+vec2(e,0.0)); float hy=wv(p.xy+vec2(0.0,e));
    vec3 n = normalize(vec3(-(hx-h)/e, -(hy-h)/e, 1.0));
    vec4 w = modelMatrix*vec4(p,1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix)*n);
    gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform vec3 uSun; uniform vec3 uCam; varying vec3 vW; varying vec3 vN;
  void main(){ vec3 v = normalize(uCam-vW); vec3 n = normalize(vN);
    float fres = pow(1.0-max(dot(v,n),0.0),3.0);
    vec3 deep = vec3(0.06,0.12,0.22); vec3 skyc = vec3(0.95,0.55,0.45);
    vec3 col = mix(deep, skyc, fres*0.8);
    vec3 r = reflect(-v,n); float s = pow(max(dot(r,uSun),0.0),120.0);
    col += vec3(1.0,0.78,0.45)*s*2.2;
    float fog = smoothstep(80.0,200.0,length(vW-uCam));
    col = mix(col, vec3(1.0,0.66,0.45), fog);
    gl_FragColor = vec4(col,1.0); }`
}));
ocean.rotation.x = -Math.PI / 2; scene.add(ocean);

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
function loop(){ ocean.material.uniforms.uTime.value = clock.getElapsedTime(); renderer.render(scene, camera); }
renderer.setAnimationLoop(loop);
document.addEventListener("visibilitychange", () => renderer.setAnimationLoop(document.hidden ? null : loop));
</script>
</body></html>
