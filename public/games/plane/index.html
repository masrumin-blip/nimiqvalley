<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nimiq Plane — Missile Escape</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#7ec8f0;font-family:"Trebuchet MS",Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;top:0;width:100%;padding:12px 14px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#hud .b{background:rgba(10,40,80,.35);border-radius:12px;padding:5px 9px;font-size:11px;letter-spacing:1px}
#hud b{display:block;font-size:19px}
#hud .coins b{color:#ffe14d}
#combo{position:absolute;left:50%;top:70px;transform:translateX(-50%);color:#ffe14d;font-size:26px;font-weight:bold;text-shadow:0 3px 0 #c0392b;pointer-events:none;opacity:0;transition:opacity .2s}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(rgba(20,60,120,.55),rgba(10,20,50,.85))}
#ov.hidden{display:none}
#ov h1{font-size:44px;line-height:1;text-shadow:0 4px 0 #c0392b,0 8px 20px rgba(0,0,0,.4)}
#ov h1 span{color:#ffe14d}
#ov h2{font-size:15px;letter-spacing:4px;color:#bfe6ff;margin-bottom:8px}
#ov .sc{font-size:30px;color:#ffe14d;margin-top:10px;text-shadow:0 3px 0 #8a5a00}
#ov p{margin-top:12px;font-size:14px;line-height:1.7;color:#e2f3ff}
#go{margin-top:20px;padding:14px 40px;font-size:18px;font-weight:bold;letter-spacing:3px;color:#fff;background:#ff5a3c;border:0;border-radius:40px;box-shadow:0 6px 0 #a52a17}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #a52a17}

#sunsetGlow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 18%,rgba(255,238,164,.32),transparent 20%),linear-gradient(180deg,transparent 55%,rgba(255,111,81,.12));mix-blend-mode:screen}
</style>
</head>
<body class="nimiq-game">
<canvas id="cv"></canvas><div id="sunsetGlow"></div>
<div id="hud">
 <div class="b">SCORE<b id="hS">0</b></div>
 <div class="b coins" style="text-align:center">COINS<b id="hC">0</b></div>
 <div class="b" style="text-align:center">TIME<b id="hT">0.0</b></div>
 <div class="b" style="text-align:right">BEST<b id="hB">0</b></div>
</div>
<div id="combo"></div>
<div id="ov">
 <h2 id="oSub">MISSILE ESCAPE</h2>
 <h1 id="oTitle">NIMIQ <span>PLANE</span></h1>
 <div class="sc" id="oScore"></div>
 <p id="oText">Hold the LEFT / RIGHT side to steer<br>(Keyboard: ← → or A D)<br>Make missiles crash into each other for bonuses!<br>Collect hex coins, shields, and turbo boosts</p>
 <button id="go">FLY</button>
</div>

var W=0,H=0,DPR=1,ZOOM=0.85;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  cv.width=Math.floor(window.innerWidth*DPR);cv.height=Math.floor(window.innerHeight*DPR);
  W=window.innerWidth/ZOOM;H=window.innerHeight/ZOOM;
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  skyG=null;
}
var skyG=null,tailG=null;
function cloudSprite(r,back){
  var s=Math.ceil(r*4),c=document.createElement('canvas');
  var sc=DPR*ZOOM;c.width=Math.ceil(s*sc);c.height=Math.ceil(s*sc);
  var g=c.getContext('2d');g.scale(sc,sc);
  var x=s/2,y=s/2;
  g.fillStyle=back?'#f7c7ca':'#fff0da';g.beginPath();
  g.arc(x,y,r,0,6.283);g.arc(x+r*0.9,y+r*0.15,r*0.75,0,6.283);
  g.arc(x-r*0.85,y+r*0.2,r*0.65,0,6.283);g.arc(x+r*0.2,y-r*0.45,r*0.6,0,6.283);g.fill();
  return {c:c,s:s};
}

var S={};
function rnd(a,b){return a+Math.random()*(b-a);}
function reset(){
  S.run=false;S.dead=false;S.deadT=-9;S.t=0;S.score=0;S.kills=0;S.stars=0;
  S.p={x:0,y:0,a:-Math.PI/2,turn:0,bank:0,shield:0,boost:0};
  S.mis=[];S.items=[];S.parts=[];S.pops=[];S.booms=[];
  S.spawnT=2.2;S.itemT=1.5;S.shake=0;S.combo=0;S.comboT=0;
  S.best=parseInt(sGet('nimiqplane_best','0'),10)||0;
  S.clouds=[];
  for(var i=0;i<26;i++){var cr=rnd(30,80),cz=rnd(.35,1);
    S.clouds.push({x:rnd(-1500,1500),y:rnd(-1500,1500),r:cr,z:cz,sp:cloudSprite(cr,cz>0.7)});}
  hB.textContent=S.best;
}
function diff(){return Math.min(1,S.t/RAMP_T);}

var keyL=false,keyR=false,touches={};
function touchDir(){
  var l=false,r=false;
  for(var id in touches){if(touches[id]<window.innerWidth/2)l=true;else r=true;}
  return (l&&!r)?-1:(r&&!l)?1:0;
}
function inputTurn(){
  var k=(keyL?-1:0)+(keyR?1:0);
  return k!==0?k:touchDir();
}
function tryStart(){
  if(S.run)return;
  if(S.dead&&S.t-S.deadT<0.6)return;
  start();
}
window.addEventListener('keydown',function(e){
  var c=e.code;
  if(c==='ArrowLeft'||c==='KeyA'){keyL=true;e.preventDefault();}
  if(c==='ArrowRight'||c==='KeyD'){keyR=true;e.preventDefault();}
  if(c==='Space'||c==='Enter'){e.preventDefault();tryStart();}
},{passive:false});
window.addEventListener('keyup',function(e){
  var c=e.code;

});

},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];touches[t.identifier]=t.clientX;}
},{passive:false});
function tEnd(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++)delete touches[e.changedTouches[i].identifier];
}
cv.addEventListener('touchend',tEnd,{passive:false});
cv.addEventListener('touchcancel',tEnd,{passive:false});
cv.addEventListener('mousedown',function(e){touches.m=e.clientX;});
window.addEventListener('mousemove',function(e){if(touches.m!==undefined)touches.m=e.clientX;});
window.addEventListener('mouseup',function(){delete touches.m;});
goBtn.addEventListener('click',function(e){e.preventDefault();tryStart();});
goBtn.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();tryStart();},{passive:false});
/* ===== EFEK ===== */
function burst(x,y,cols,n,pw){
  for(var i=0;i<n;i++){var a=Math.random()*6.283,s=rnd(40,260)*pw;
    S.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.9),max:.9,
      c:cols[i%cols.length],r:rnd(2,6)});}
}
function boom(x,y,big){
  S.booms.push({x:x,y:y,t:0,max:big?.75:.5,r:big?95:60});
  burst(x,y,['#ffe14d','#ff9f1a','#ff4b2b','#ffffff'],big?34:20,big?1.4:1);
  S.shake=Math.max(S.shake,big?1:.45);
}
function pop(x,y,txt,c){S.pops.push({x:x,y:y,t:txt,c:c,life:1});}
function showCombo(txt){
  comboEl.textContent=txt;comboEl.style.opacity=1;
  clearTimeout(showCombo.h);
  showCombo.h=setTimeout(function(){comboEl.style.opacity=0;},900);
}

/* ===== SPAWN ===== */
function spawnMissile(){
  var d=diff(),a=Math.random()*6.283,dist=Math.max(W,H)*0.75+80;
  var x=S.p.x+Math.cos(a)*dist,y=S.p.y+Math.sin(a)*dist;
  var kind='normal',r=Math.random();
  if(d>0.25&&r<0.18+d*0.12)kind='fast';
  else if(d>0.45&&r<0.34+d*0.12)kind='agile';
  var spd=MIS_SPD0+(MIS_SPD1-MIS_SPD0)*d,turn=MIS_TURN0+(MIS_TURN1-MIS_TURN0)*d;
  if(kind==='fast'){spd*=1.22;turn*=0.72;}
  if(kind==='agile'){spd*=0.9;turn*=1.32;}
  S.mis.push({x:x,y:y,a:Math.atan2(S.p.y-y,S.p.x-x),spd:spd,turn:turn,
    life:MIS_LIFE+rnd(-1,1.5),kind:kind,trail:0,warn:1.2});
}
function spawnItem(){
  var a=Math.random()*6.283,d=rnd(260,Math.max(W,H)*0.65);
  var r=Math.random(),k=r<0.68?'star':r<0.86?'shield':'boost';
  S.items.push({x:S.p.x+Math.cos(a)*d,y:S.p.y+Math.sin(a)*d,k:k,life:16,bob:Math.random()*6});
}

/* ===== UPDATE ===== */
function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;return d;}

function update(dt){
  S.t+=dt;
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*2.6);
  var i,j;
  for(i=S.parts.length-1;i>=0;i--){var q=S.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;
    q.vx*=0.95;q.vy*=0.95;q.life-=dt;if(q.life<=0)S.parts.splice(i,1);}
  for(i=S.booms.length-1;i>=0;i--){S.booms[i].t+=dt;if(S.booms[i].t>S.booms[i].max)S.booms.splice(i,1);}
  for(i=S.pops.length-1;i>=0;i--){S.pops[i].y-=40*dt;S.pops[i].life-=dt;if(S.pops[i].life<=0)S.pops.splice(i,1);}

  var p=S.p;
  if(!S.run){ if(!S.dead){p.a+=dt*0.6;p.x+=Math.cos(p.a)*120*dt;p.y+=Math.sin(p.a)*120*dt;} return; }

  /* pesawat */
  var tIn=inputTurn();
  p.turn+=(tIn-p.turn)*Math.min(1,dt*10);
  p.a+=p.turn*PLANE_TURN*dt;
  p.bank+=(p.turn*0.55-p.bank)*Math.min(1,dt*8);
  var spd=PLANE_SPD*(p.boost>0?BOOST_MUL:1);
  p.x+=Math.cos(p.a)*spd*dt;p.y+=Math.sin(p.a)*spd*dt;
  if(p.shield>0)p.shield-=dt;
  if(p.boost>0)p.boost-=dt;
  S.score+=dt*10;
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}

  /* jejak asap pesawat */
  var th=p.a+Math.PI/2,ct=Math.cos(th),st=Math.sin(th);
  var JETS=[[-15,9],[15,9],[-7,7],[7,7],[-8,29],[8,29],[0,30]];
  for(var jj=0;jj<JETS.length;jj++){if(Math.random()<0.3){var lx=JETS[jj][0],ly=JETS[jj][1];
    S.parts.push({x:p.x+lx*ct-ly*st,y:p.y+lx*st+ly*ct,vx:0,vy:0,life:.5,max:.5,
      c:p.boost>0?'rgba(127,231,255,.95)':'rgba(170,228,255,.8)',r:2.3});}}

  /* spawn rudal: jeda mengecil & batas jumlah membesar seiring waktu */
  var d=diff(),maxM=2+Math.floor(d*5);
  S.spawnT-=dt;
  if(S.spawnT<=0){
    if(S.mis.length<maxM)spawnMissile();
    S.spawnT=rnd(2.6,3.6)*(1-d*0.6);
  }
  S.itemT-=dt;
  if(S.itemT<=0){if(S.items.length<5)spawnItem();S.itemT=rnd(1.6,2.8);}

  /* rudal */
  for(i=S.mis.length-1;i>=0;i--){
    var m=S.mis[i];
    if(m.warn>0)m.warn-=dt;
    m.px=m.x;m.py=m.y;m.pa=m.a;
    var want=Math.atan2(p.y-m.y,p.x-m.x);
    var dd=angDiff(m.a,want),mt=m.turn*dt;
    m.a+=Math.max(-mt,Math.min(mt,dd));
    m.x+=Math.cos(m.a)*m.spd*dt;m.y+=Math.sin(m.a)*m.spd*dt;
    m.life-=dt;
    m.trail-=dt;
    if(m.trail<=0){m.trail=0.025;
      S.parts.push({x:m.x-Math.cos(m.a)*9.8,y:m.y-Math.sin(m.a)*9.8,vx:rnd(-12,12),vy:rnd(-12,12),
        life:.7,max:.7,c:m.life<2?'#ffb3a7':'rgba(220,220,230,.85)',r:4});}
    if(m.life<=0){boom(m.x,m.y,false);pop(m.x,m.y,'+5 coins','#ffe329');S.score+=5;S.stars+=5;S.mis.splice(i,1);continue;}
    if(NimiqCollision.missileHitsPlane(m,p)){
      if(p.shield>0){boom(m.x,m.y,false);p.shield=0;S.stars+=10;pop(p.x,p.y-30,'SHIELD!','#7fe7ff');S.mis.splice(i,1);continue;}
      die();return;
    }
  }
  /* rudal saling tabrakan */
  for(i=S.mis.length-1;i>=0;i--){
    for(j=i-1;j>=0;j--){
      var a1=S.mis[i],a2=S.mis[j];if(!a1||!a2)continue;
      var ex=a1.x-a2.x,ey=a1.y-a2.y;
      if(ex*ex+ey*ey<MM_R*MM_R){
        var cx=(a1.x+a2.x)/2,cy=(a1.y+a2.y)/2;
        boom(cx,cy,true);
        S.combo++;S.comboT=3;S.kills+=2;S.stars+=10;
        var bonus=50*S.combo;S.score+=bonus;
        pop(cx,cy,'+'+bonus,'#ffe14d');
        showCombo(S.combo>1?'COMBO x'+S.combo+'!':'BOOM!');
        S.mis.splice(i,1);S.mis.splice(j,1);i--;break;
      }
    }
  }
  /* item */
  for(i=S.items.length-1;i>=0;i--){
    var it=S.items[i];it.life-=dt;it.bob+=dt*3;
    var ix=it.x-p.x,iy=it.y-p.y;
    if(ix*ix+iy*iy<34*34){
      if(it.k==='star'){S.stars++;S.picks=(S.picks||0)+1;S.score+=25;pop(it.x,it.y,'+25','#ffe14d');burst(it.x,it.y,['#ffe14d','#fff'],10,.6);}
      else if(it.k==='shield'){p.shield=8;pop(it.x,it.y,'SHIELD','#7fe7ff');burst(it.x,it.y,['#7fe7ff','#fff'],12,.7);}
      else {p.boost=4;pop(it.x,it.y,'TURBO','#b6ff5c');burst(it.x,it.y,['#b6ff5c','#fff'],12,.7);}
      S.items.splice(i,1);continue;
    }
    if(it.life<=0||ix*ix+iy*iy>2400*2400)S.items.splice(i,1);
  }
  /* awan ikut berputar di sekitar pemain */
  for(i=0;i<S.clouds.length;i++){
    var c=S.clouds[i],cxp=c.x-p.x*c.z,cyp=c.y-p.y*c.z,lim=1100;
    if(cxp<-lim)c.x+=lim*2;else if(cxp>lim)c.x-=lim*2;
    if(cyp<-lim)c.y+=lim*2;else if(cyp>lim)c.y-=lim*2;
  }
}
/* ===== RENDER ===== */
function drawSky(){
  if(!skyG){skyG=ctx.createLinearGradient(0,0,0,H);
  skyG.addColorStop(0,'#29356f');skyG.addColorStop(.42,'#d46975');skyG.addColorStop(.74,'#f39a67');skyG.addColorStop(1,'#ffd59c');}
  ctx.fillStyle=skyG;ctx.fillRect(-50,-50,W+100,H+100);
}
function drawClouds(back){
  var p=S.p;
  for(var i=0;i<S.clouds.length;i++){
    var c=S.clouds[i];
    if(back?c.z>0.7:c.z<=0.7)continue;
    var x=W/2+(c.x-p.x*c.z),y=H/2+(c.y-p.y*c.z);
    if(x<-200||x>W+200||y<-200||y>H+200)continue;
    ctx.globalAlpha=back?0.55:0.85;
    var sp=c.sp;ctx.drawImage(sp.c,x-sp.s/2,y-sp.s/2,sp.s,sp.s);
  }
  ctx.globalAlpha=1;
}
function drawPlane(x,y,a,bank){
  ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
  var w=1;
  if(planeImg.complete&&planeImg.naturalWidth){
    ctx.scale(0.7,0.7);ctx.drawImage(planeImg,-28,-29,56,58);
  }
  ctx.restore();
}
function drawMissile(m,sx,sy){
  ctx.save();ctx.translate(sx,sy);ctx.rotate(m.a);ctx.scale(0.7,0.7);
  var body=m.kind==='fast'?'#ffd23f':m.kind==='agile'?'#c27bff':'#ffffff';
  /* jejak asap mencolok */
  if(!tailG){tailG=ctx.createLinearGradient(-10,0,-60,0);
  tailG.addColorStop(0,'rgba(255,255,255,.85)');tailG.addColorStop(1,'rgba(255,255,255,0)');}
  ctx.fillStyle=tailG;ctx.beginPath();ctx.moveTo(-10,-3);ctx.lineTo(-60,-7);ctx.lineTo(-60,7);ctx.lineTo(-10,3);ctx.fill();
  /* cincin peringatan berdenyut */
  var pulse=0.5+0.5*Math.sin(performance.now()/90);
  ctx.strokeStyle='rgba(255,40,40,'+(0.35+pulse*0.45)+')';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(2,0,13+pulse*3,0,6.283);ctx.stroke();
  /* api */
  var fl=10+Math.random()*9;
  ctx.fillStyle='rgba(255,122,0,.35)';ctx.beginPath();ctx.arc(-12,0,7,0,6.283);ctx.fill();
  ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-10-fl,0);ctx.lineTo(-10,4);ctx.fill();
  ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.moveTo(-10,-2);ctx.lineTo(-10-fl*0.55,0);ctx.lineTo(-10,2);ctx.fill();
  /* badan dengan garis tepi gelap */
  ctx.strokeStyle='#1a1020';ctx.lineWidth=1.6;
  ctx.fillStyle=body;ctx.beginPath();ctx.rect(-10,-3.5,18,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff1f1f';ctx.beginPath();ctx.moveTo(8,-3.5);ctx.lineTo(15,0);ctx.lineTo(8,3.5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff1f1f';ctx.fillRect(-2,-3.5,3,7);
  ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(-10,-3.5);ctx.lineTo(-14,-8);ctx.lineTo(-5,-3.5);ctx.fill();
  ctx.beginPath();ctx.moveTo(-10,3.5);ctx.lineTo(-14,8);ctx.lineTo(-5,3.5);ctx.fill();
  /* kedip saat bahan bakar hampir habis */
  if(m.life<2&&Math.floor(m.life*8)%2===0){ctx.fillStyle='#ffef3a';ctx.fillRect(-6,-3.5,4,7);}
  ctx.restore();
}
function drawArrow(m){
  /* penanda arah rudal di luar layar */
  var sx=W/2+(m.x-S.p.x),sy=H/2+(m.y-S.p.y);
  if(sx>-10&&sx<W+10&&sy>-10&&sy<H+10)return false;
  var ang=Math.atan2(sy-H/2,sx-W/2),pad=26;
  var ex=Math.max(pad,Math.min(W-pad,W/2+Math.cos(ang)*W)),ey=Math.max(pad,Math.min(H-pad,H/2+Math.sin(ang)*H));
  var dist=Math.sqrt((m.x-S.p.x)*(m.x-S.p.x)+(m.y-S.p.y)*(m.y-S.p.y));
  var close=Math.max(0,Math.min(1,1-(dist-300)/900));
  ctx.save();ctx.translate(ex,ey);ctx.rotate(ang);
  ctx.globalAlpha=0.5+close*0.5;
  ctx.fillStyle=close>0.6?'#ff2d2d':'#ff8a3d';
  ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-9);ctx.lineTo(-4,0);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
  return true;
}
function drawItem(it,sx,sy){
  var b=Math.sin(it.bob)*4;
  ctx.save();ctx.translate(sx,sy+b);
  if(it.life<3&&Math.floor(it.life*6)%2===0)ctx.globalAlpha=0.35;
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(0,0,18,0,6.283);ctx.fill();
  if(it.k==='star'){
    ctx.fillStyle='rgba(255,229,77,.35)';ctx.beginPath();ctx.arc(0,0,17,0,6.283);ctx.fill();
    ctx.fillStyle='#ffe329';ctx.strokeStyle='#fff49a';ctx.lineWidth=2;ctx.beginPath();
    for(var i=0;i<6;i++){var a=i*Math.PI/3;var hx=Math.cos(a)*13,hy=Math.sin(a)*13;if(i===0)ctx.moveTo(hx,hy);else ctx.lineTo(hx,hy);}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.48)';ctx.beginPath();ctx.moveTo(-6,-7);ctx.lineTo(6,-7);ctx.lineTo(9,-2);ctx.lineTo(-9,-2);ctx.closePath();ctx.fill();
  }else if(it.k==='shield'){
    ctx.fillStyle='#3fc3ff';ctx.strokeStyle='#0b6fa8';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(0,-12);ctx.lineTo(10,-7);ctx.lineTo(8,5);ctx.lineTo(0,12);ctx.lineTo(-8,5);ctx.lineTo(-10,-7);
    ctx.closePath();ctx.fill();ctx.stroke();
  }else{
    ctx.fillStyle='#8be32b';ctx.strokeStyle='#3f7a05';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(3,-13);ctx.lineTo(-7,2);ctx.lineTo(0,2);ctx.lineTo(-3,13);ctx.lineTo(7,-2);ctx.lineTo(0,-2);
    ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  if(S.shake>0){var k=S.shake*10;ctx.translate(rnd(-k,k),rnd(-k,k));}
  drawSky();drawClouds(true);
  var p=S.p,ox=W/2-p.x,oy=H/2-p.y,i;
  for(i=0;i<S.parts.length;i++){var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max)*0.9;ctx.fillStyle=q.c;
    ctx.beginPath();ctx.arc(q.x+ox,q.y+oy,q.r*(0.6+q.life/q.max*0.6),0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  for(i=0;i<S.items.length;i++){var it=S.items[i];drawItem(it,it.x+ox,it.y+oy);}
  for(i=0;i<S.mis.length;i++){var m=S.mis[i];
    if(!drawArrow(m))drawMissile(m,m.x+ox,m.y+oy);}
  if(!S.dead){
    if(p.shield>0){
      var sa=p.shield<2&&Math.floor(p.shield*8)%2===0?0.15:0.4;
      ctx.strokeStyle='rgba(127,231,255,'+sa+')';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(W/2,H/2,26,0,6.283);ctx.stroke();
      ctx.fillStyle='rgba(127,231,255,'+(sa*0.4)+')';ctx.fill();
    }
    drawPlane(W/2,H/2,p.a,p.bank);
  }
  for(i=0;i<S.booms.length;i++){var b=S.booms[i],f=b.t/b.max;
    ctx.globalAlpha=1-f;
    ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.arc(b.x+ox,b.y+oy,b.r*f*0.6,0,6.283);ctx.fill();
    ctx.strokeStyle='#ff7a1a';ctx.lineWidth=6*(1-f);
    ctx.beginPath();ctx.arc(b.x+ox,b.y+oy,b.r*f,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  drawClouds(false);
  ctx.font='bold 18px Trebuchet MS';ctx.textAlign='center';
  for(i=0;i<S.pops.length;i++){var o=S.pops[i];
    ctx.globalAlpha=Math.min(1,o.life*1.5);
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillText(o.t,o.x+ox+1,o.y+oy+2);
    ctx.fillStyle=o.c;ctx.fillText(o.t,o.x+ox,o.y+oy);}
  ctx.globalAlpha=1;
  /* vignette merah saat rudal dekat */
  if(S.run){
    var near=9999;
    for(i=0;i<S.mis.length;i++){var dx=S.mis[i].x-p.x,dy=S.mis[i].y-p.y;near=Math.min(near,Math.sqrt(dx*dx+dy*dy));}
    if(near<220){
      var al=(1-near/220)*0.35;
      var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
      vg.addColorStop(0,'rgba(255,0,0,0)');vg.addColorStop(1,'rgba(255,30,30,'+al+')');
      ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    }
  }
}

/* ===== FLOW ===== */
function start(){
  reset();S.run=true;
  S.picks=0;S.wall0=Date.now();try{parent.postMessage({type:'nimiq-start',slug:'plane'},location.origin);}catch(e){}
  ov.classList.add('hidden');
  S.spawnT=1.4;
}
function die(){
  if(S.dead)return;
  var p=S.p;
  S.run=false;S.dead=true;S.deadT=S.t;
  boom(p.x,p.y,true);
  burst(p.x,p.y,['#d9342b','#ffffff','#555'],22,1.3);
  S.shake=1.2;
  var sc=Math.floor(S.score);
  try{parent.postMessage({type:'nimiq-run',slug:'plane',score:sc,durationSec:Math.min(S.t,(Date.now()-(S.wall0||Date.now()))/1000),wave:0,kills:{missile:S.kills},coins:S.stars||0},location.origin);}catch(e){}
  if(sc>S.best){S.best=sc;sSet('nimiqplane_best',String(sc));oSub.textContent='NEW RECORD!';}
  else oSub.textContent='SHOT DOWN!';
  hB.textContent=S.best;
  oTitle.innerHTML='GAME <span>OVER</span>';
  oScore.textContent=sc+' points';
  oText.innerHTML='Survived '+S.t.toFixed(1)+' seconds<br>Missiles destroyed: '+S.kills+
    '<br>Coins: '+S.stars+'<br><br>Tap FLY AGAIN to play again';
  goBtn.textContent='FLY AGAIN';
  setTimeout(function(){ov.classList.remove('hidden');},700);
}

/* ===== LOOP ===== */
var last=0;
function loop(ts){
  if(!last)last=ts;
  var dt=Math.min((ts-last)/1000,0.033);last=ts;
  update(dt);render();
  var vs=String(Math.floor(S.score)),vc=String(S.stars),vt=S.run?S.t.toFixed(1):(S.dead?S.deadT.toFixed(1):'0.0');
  if(vs!==loop.s){loop.s=vs;hS.textContent=vs;}
  if(vc!==loop.c){loop.c=vc;hC.textContent=vc;}
  if(vt!==loop.t){loop.t=vt;hT.textContent=vt;}
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
})();
